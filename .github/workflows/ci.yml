name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-23.11
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: nix develop --command bash -c "sbt scalafmtCheckAll scalafmtSbtCheck"

      - name: Check scripts/ci.sh is up to date
        run: |
          nix develop --command bash -c '
            out=$(mktemp) &&
            python3 scripts/generate-ci.py .github/workflows/ci.yml "$out" &&
            diff -u scripts/ci.sh "$out"
          ' || { echo "scripts/ci.sh is stale: run scripts/generate-ci.py and commit" >&2; exit 1; }

  test:
    name: test (Scala ${{ matrix.scala }}, JDK ${{ matrix.jdk }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # scala: keep in sync with crossScalaVersions in build.sbt; jdk: devShells.jdkNN in flake.nix
        scala: ["2.13.18", "3.3.8"]
        jdk: ["17", "21"]
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-23.11
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build and Test
        run: nix develop .#jdk${{ matrix.jdk }} --command bash -c "sbt '++${{ matrix.scala }}!' clean compile test"

      - name: Run application
        run: nix develop .#jdk${{ matrix.jdk }} --command bash -c "sbt '++${{ matrix.scala }}!' 'run World'"
